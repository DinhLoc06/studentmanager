spring.application.name=quanlydaotao

# SQL Server Windows Authentication. Database shown in SQL Server Management Studio.
# Override DB_URL when using another server/instance, for example:
# SQL Server instance MSSQLSERVER should listen on TCP port 1433.
# Enable TCP/IP for this instance in SQL Server Configuration Manager, then restart SQL Server.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=StudentManager;integratedSecurity=true;authenticationScheme=NativeAuthentication;encrypt=true;trustServerCertificate=true}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver


spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true


server.port=8080
