<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>School Manager</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-beta.3/dist/css/adminlte.min.css" />
    <link rel="stylesheet" href="https://cdn.datatables.net/2.1.8/css/dataTables.bootstrap5.min.css" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
    <div class="app-wrapper">
      <aside class="app-sidebar bg-body">
        <div class="brand">
          <span class="brand-icon">A</span>
          <span class="brand-text">School Manager</span>
        </div>

        <nav class="nav nav-pills flex-column gap-2 px-3 py-3">
          <a class="nav-link active" href="#">
            <i class="bi bi-people-fill me-2"></i>
            <span>Sinh viên</span>
          </a>
        </nav>
      </aside>

      <div class="app-main">
        <nav class="main-header navbar navbar-expand bg-white border-bottom px-3">
          <button class="btn btn-link text-dark d-lg-none" type="button" aria-label="Menu">
            <i class="bi bi-list fs-4"></i>
          </button>
          <span class="navbar-brand mb-0 h6 text-dark ms-2">Quản Lý Đào Tạo</span>
        </nav>

        <main class="content-wrapper px-4 py-4">
          <div class="container-fluid">
            <div class="d-flex align-items-center justify-content-between mb-4">
              <h1 class="page-title mb-0">Quản lý sinh viên</h1>
              <ol class="breadcrumb mb-0 text-muted">
                <li class="breadcrumb-item"><a href="#">Trang chủ</a></li>
                <li class="breadcrumb-item active">Sinh viên</li>
              </ol>
            </div>

            <div class="card shadow-sm border-0">
              <div class="card-header bg-white border-bottom">
                <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3">
                  <div class="input-group search-group" style="max-width: 420px;">
                    <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                    <input id="searchInput" type="text" class="form-control" placeholder="Tìm theo mã / họ tên / email..." />
                  </div>

                  <div class="d-flex gap-2">
                    <button id="searchBtn" class="btn btn-primary" type="button">
                      <i class="bi bi-search me-1"></i>
                      Tìm kiếm
                    </button>
                    <button id="exportExcelBtn" class="btn btn-success" type="button" title="Xuất Excel">
                      <i class="bi bi-file-earmark-excel me-1"></i>
                      Excel
                    </button>
                    <button id="exportPdfBtn" class="btn btn-danger" type="button" title="Xuất PDF">
                      <i class="bi bi-file-earmark-pdf me-1"></i>
                      PDF
                    </button>
                    <button id="addStudentBtn" class="btn btn-primary" type="button">
                      <i class="bi bi-plus-lg me-1"></i>
                      Thêm sinh viên
                    </button>
                  </div>
                </div>
              </div>

              <div class="card-body p-0">
                <div class="table-responsive">
                  <table id="studentTable" class="table table-hover table-bordered align-middle mb-0">
                    <thead class="table-light">
                      <tr>
                        <th style="width: 14%;">Mã sinh viên</th>
                        <th style="width: 22%;">Họ và tên</th>
                        <th style="width: 24%;">Email</th>
                        <th style="width: 18%;">Số điện thoại</th>
                        <th style="width: 12%;">Lớp</th>
                        <th style="width: 10%;">Hành động</th>
                      </tr>
                    </thead>
                    <tbody id="studentTableBody"></tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <div class="modal fade" id="studentModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="studentModalTitle">Thêm sinh viên</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <form id="studentForm">
            <div class="modal-body">
              <div class="row g-3">
                <div class="col-md-6">
                  <label for="studentCode" class="form-label">Mã sinh viên</label>
                  <input id="studentCode" name="studentCode" type="text" class="form-control" required />
                </div>
                <div class="col-md-6">
                  <label for="className" class="form-label">Lớp</label>
                  <input id="className" name="className" type="text" class="form-control" required />
                </div>
                <div class="col-12">
                  <label for="fullName" class="form-label">Họ và tên</label>
                  <input id="fullName" name="fullName" type="text" class="form-control" required />
                </div>
                <div class="col-12">
                  <label for="email" class="form-label">Email</label>
                  <input id="email" name="email" type="email" class="form-control" required />
                </div>
                <div class="col-12">
                  <label for="phone" class="form-label">Số điện thoại</label>
                  <input id="phone" name="phone" type="tel" class="form-control" required />
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
              <button type="submit" class="btn btn-primary">Lưu</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.12.4.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/2.1.8/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/2.1.8/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-beta.3/dist/js/adminlte.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script>
    <script src="/js/students.js"></script>
  </body>
</html>
